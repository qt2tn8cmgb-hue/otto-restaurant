<style>
:root{--sage:#738476;--gold:#E0BE4B;--bg:#F8F7F3;--card:#fff;--ink:#252824;--mut:#777B76;--line:rgba(37,40,36,.12);--r:14px;--s:clamp(64px,9vw,112px);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1f1c;--card:#252824;--ink:#F8F7F3;--mut:#a3a8a2;--line:rgba(248,247,243,.14)}}
*,*::before,*::after{box-sizing:inherit}
html{overflow-x:hidden;max-width:100%;overscroll-behavior-x:none;scroll-behavior:smooth;scroll-padding-top:calc(76px + env(safe-area-inset-top,0px));height:auto}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.65 Inter,system-ui,sans-serif;overflow-x:hidden;max-width:100%;position:relative;overscroll-behavior-x:none}
img{max-width:100%;display:block}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;font-weight:500;line-height:1.15;margin:0}
.w{width:min(1160px,100% - 40px);margin:0 auto}
section{padding:var(--s) 0}
.eye{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--sage);display:flex;align-items:center;gap:12px;margin-bottom:16px}
.eye::before{content:"";width:28px;height:1px;background:var(--gold)}
h2{font-size:clamp(30px,4.4vw,46px);margin-bottom:18px}
.lead{color:var(--mut);max-width:560px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 28px;border-radius:999px;border:1px solid var(--sage);background:var(--sage);color:#fff;font:500 15px Inter,sans-serif;cursor:pointer;text-decoration:none;transition:.25s}
.btn:hover{background:#627466;transform:translateY(-1px)}
.btn.o{background:transparent;color:inherit;border-color:currentColor}
.btn.o:hover{background:rgba(255,255,255,.14)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
header{position:fixed;top:0;left:0;right:0;z-index:50;padding-top:env(safe-area-inset-top,0px);background:rgba(248,247,243,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) header{background:rgba(28,31,28,.9)}}
.nav{display:flex;align-items:center;justify-content:space-between;height:68px;gap:16px}
.logo{font:500 26px 'Playfair Display',serif;letter-spacing:.32em;color:var(--ink);text-decoration:none}
.logo i{color:var(--gold);font-style:normal}
.links{display:flex;gap:26px}
.links a{color:var(--ink);text-decoration:none;font-size:14px;transition:.2s}
.links a:hover{color:var(--sage)}
.lang{display:flex;gap:2px;border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{border:0;background:none;color:var(--mut);font:500 12px Inter;padding:6px 10px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--sage);color:#fff}
.burger{display:none;width:44px;height:44px;border:0;background:none;cursor:pointer;position:relative}
.burger span{position:absolute;left:11px;right:11px;height:1.5px;background:var(--ink);transition:.3s}
.burger span:nth-child(1){top:16px}.burger span:nth-child(2){top:22px}.burger span:nth-child(3){top:28px}
.burger[aria-expanded=true] span:nth-child(1){top:22px;transform:rotate(45deg)}
.burger[aria-expanded=true] span:nth-child(2){opacity:0}
.burger[aria-expanded=true] span:nth-child(3){top:22px;transform:rotate(-45deg)}
@media (max-width:900px){
.burger{display:block}
.links{position:fixed;top:calc(68px + env(safe-area-inset-top,0px));left:0;right:0;flex-direction:column;gap:0;background:var(--bg);padding:8px 20px 20px;border-bottom:1px solid var(--line);transform:translateY(-12px);opacity:0;visibility:hidden;transition:.3s}
.links.open{transform:none;opacity:1;visibility:visible}
.links a{padding:15px 0;border-bottom:1px solid var(--line);font-size:17px}
}
.hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;color:#fff;padding:120px 0 64px;background:#252824}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(37,40,36,.35),rgba(37,40,36,.72))}
.hero .w{position:relative;z-index:2}
.hero h1{font-size:clamp(64px,15vw,150px);letter-spacing:.2em;margin-bottom:14px}
.hero p{max-width:480px;font-size:clamp(16px,2.2vw,19px);opacity:.92;margin:0 0 30px}
.hero .gl{width:56px;height:2px;background:var(--gold);margin-bottom:22px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(28px,6vw,80px);align-items:center}
.ph{border-radius:var(--r);aspect-ratio:4/5;object-fit:cover;width:100%}
.note{margin-top:18px;padding:12px 16px;border:1px dashed var(--gold);border-radius:10px;color:var(--mut);font-size:14px}
@media (max-width:800px){.two{grid-template-columns:minmax(0,1fr)}}
#menu{background:var(--card)}
.tabs{display:flex;gap:8px;overflow-x:auto;overscroll-behavior-x:contain;max-width:100%;padding:4px 0 14px;margin:28px 0 8px;scrollbar-width:thin}
.tabs button{flex:none;border:1px solid var(--line);background:transparent;color:var(--ink);padding:10px 18px;border-radius:999px;font:500 14px Inter;cursor:pointer;transition:.2s;min-height:42px}
.tabs button:hover{border-color:var(--sage)}
.tabs button[aria-selected=true]{background:var(--sage);border-color:var(--sage);color:#fff}
.cat{display:flex;align-items:baseline;gap:14px;margin:18px 0 8px;flex-wrap:wrap}
.cat h3{font-size:clamp(26px,4vw,38px)}
.cat small{color:var(--sage);font:italic 400 18px 'Playfair Display',serif}
.list{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 56px;animation:fi .45s both}
.it{display:flex;align-items:baseline;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
.it>div:first-child{min-width:0;overflow-wrap:anywhere}.it b{font-weight:500}
.it em{display:block;font-size:13px;color:var(--sage)}
.it span.d{flex:1;border-bottom:1px dotted var(--mut);opacity:.4;transform:translateY(-4px);min-width:12px}
.it .p{font:500 16px 'Playfair Display',serif;white-space:nowrap;color:var(--ink)}
.it .p::after{content:"";}
.mn{color:var(--mut);font-size:13px;margin-top:22px}
@media (max-width:800px){.list{grid-template-columns:minmax(0,1fr)}}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:34px}
.grid button{padding:0;border:0;border-radius:var(--r);overflow:hidden;aspect-ratio:4/5;cursor:zoom-in;background:var(--line)}
.grid img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.grid button:hover img{transform:scale(1.05)}
@media (max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.lb{position:fixed;inset:0;z-index:100;background:rgba(20,22,20,.92);display:none;align-items:center;justify-content:center;padding:24px}
.lb.on{display:flex}.lb img{max-height:90vh;border-radius:10px}
#res{background:var(--card)}

.f{display:flex;flex-direction:column;gap:6px}.f.full{grid-column:1/-1}
label{font-size:13px;color:var(--mut)}

input:focus,select:focus,textarea:focus{outline:2px solid var(--sage);outline-offset:1px}
.err{color:#b3402f;font-size:13px;min-height:0}
[aria-invalid=true]{border-color:#b3402f}
.call{display:block;margin-top:22px;padding:24px;border-radius:var(--r);background:var(--sage);color:#fff}
.call.on{display:block;animation:fi .4s both}
.call a.n{display:block;font:500 clamp(28px,6vw,38px) 'Playfair Display',serif;color:#fff;text-decoration:none;margin:6px 0 16px}
.call .btn{background:#fff;color:var(--sage);border-color:#fff}
.call .btn.o{background:transparent;color:#fff}
.note.s{margin:0 0 18px}[hidden]{display:none!important}#res,#contacts{text-align:center}#res .eye,#contacts .eye{justify-content:center}#res .lead,#contacts .lead{margin-inline:auto}.call .row{justify-content:center}

.cc{padding:22px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.cc h4{margin:0 0 8px;font:500 12px Inter;letter-spacing:.18em;text-transform:uppercase;color:var(--sage)}
.cc a{color:var(--ink)}
.cc .ed{color:var(--mut);font-size:14px}
.map{margin-top:16px;min-height:200px;border:1px dashed var(--gold);border-radius:var(--r);display:flex;align-items:center;justify-content:center;color:var(--mut);text-align:center;padding:20px}

footer{background:#252824;color:#F8F7F3;padding:48px 0 32px}

footer .logo{color:var(--gold)}
footer nav{display:flex;gap:10px 24px;flex-wrap:wrap;justify-content:center}
footer a{color:#F8F7F3;opacity:.8;text-decoration:none;font-size:14px}footer a:hover{opacity:1;color:var(--gold)}
footer small{opacity:.55}
.rv{opacity:0;transform:translateY(16px);transition:opacity .8s,transform .8s}.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
.wm{display:block;height:auto;color:var(--gold)}.logo .wm{width:112px}header .logo{display:inline-flex}footer .logo .wm{width:150px}.hero h1{margin-bottom:18px}.hero h1 .wm{width:min(78vw,460px)}.call a.n{font-family:Inter,system-ui,sans-serif;font-weight:500;letter-spacing:.02em;font-variant-numeric:lining-nums tabular-nums}.it .p{font-variant-numeric:lining-nums;font-feature-settings:"lnum"}

.sh{position:fixed;inset:0;z-index:100;background:rgba(20,22,20,.55);display:none;align-items:flex-end;justify-content:center}.sh.on{display:flex}.shc{background:var(--card);width:min(480px,100%);padding:28px 24px calc(28px + env(safe-area-inset-bottom,0px));border-radius:20px 20px 0 0;text-align:center;animation:fi .3s both}.shc h3{font-size:24px;margin-bottom:8px}.shc .n{display:block;font:500 30px Inter,sans-serif;color:var(--ink);text-decoration:none;margin:6px 0 20px;font-variant-numeric:lining-nums tabular-nums}.shc .row{justify-content:center}.shc .btn.o{color:var(--ink)}
